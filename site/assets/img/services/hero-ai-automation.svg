<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="gai1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4154f1"/>
      <stop offset="100%" stop-color="#47b2e4"/>
    </linearGradient>
    <linearGradient id="gai2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#012970"/>
      <stop offset="100%" stop-color="#4154f1"/>
    </linearGradient>
    <filter id="shai">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4154f1" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Neural Grid -->
  <circle cx="250" cy="200" r="160" fill="url(#gai1)" opacity="0.08"/>
  <circle cx="250" cy="200" r="110" stroke="url(#gai1)" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.3"/>
  <circle cx="250" cy="200" r="150" stroke="url(#gai1)" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.2"/>

  <!-- Neural Nodes -->
  <line x1="250" y1="200" x2="160" y2="120" stroke="url(#gai1)" stroke-width="2" opacity="0.4"/>
  <line x1="250" y1="200" x2="340" y2="120" stroke="url(#gai1)" stroke-width="2" opacity="0.4"/>
  <line x1="250" y1="200" x2="140" y2="250" stroke="url(#gai1)" stroke-width="2" opacity="0.4"/>
  <line x1="250" y1="200" x2="360" y2="250" stroke="url(#gai1)" stroke-width="2" opacity="0.4"/>
  <line x1="250" y1="200" x2="250" y2="330" stroke="url(#gai1)" stroke-width="2" opacity="0.4"/>

  <!-- Central AI Core -->
  <g transform="translate(190, 140)" filter="url(#shai)">
    <rect width="120" height="120" rx="30" fill="url(#gai2)"/>
    <circle cx="60" cy="60" r="42" fill="url(#gai1)" opacity="0.25"/>
    <circle cx="60" cy="60" r="30" fill="#ffffff" opacity="0.1"/>
    <!-- Brain / Circuit Icon -->
    <path d="M50 48 Q 42 54, 46 62 Q 40 70, 50 74 Q 52 78, 60 76 Q 68 78, 70 74 Q 80 70, 74 62 Q 78 54, 70 48 Q 66 42, 60 44 Q 54 42, 50 48 Z" fill="none" stroke="#47b2e4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="5" fill="#47b2e4"/>
  </g>

  <!-- Floating AI Nodes -->
  <!-- Node 1: Chatbot -->
  <g transform="translate(110, 80)" filter="url(#shai)">
    <rect width="80" height="50" rx="14" fill="#ffffff" stroke="#e1ecff" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="10" fill="#4154f1"/>
    <text x="25" y="29" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">AI</text>
    <rect x="42" y="18" width="28" height="6" rx="3" fill="#012970"/>
    <rect x="42" y="28" width="20" height="5" rx="2.5" fill="#47b2e4"/>
  </g>

  <!-- Node 2: ML Analytics -->
  <g transform="translate(310, 80)" filter="url(#shai)">
    <rect width="90" height="55" rx="14" fill="#ffffff" stroke="#e1ecff" stroke-width="1.5"/>
    <rect x="15" y="32" width="10" height="12" rx="2" fill="#4154f1"/>
    <rect x="30" y="22" width="10" height="22" rx="2" fill="#47b2e4"/>
    <rect x="45" y="16" width="10" height="28" rx="2" fill="#27c93f"/>
    <path d="M15 32 L35 22 L50 16 L75 10" stroke="#012970" stroke-width="2" fill="none"/>
  </g>

  <!-- Node 3: Automation Cog -->
  <g transform="translate(80, 230)" filter="url(#shai)">
    <rect width="95" height="55" rx="14" fill="#ffffff" stroke="#e1ecff" stroke-width="1.5"/>
    <circle cx="28" cy="27" r="12" fill="#e1ecff"/>
    <circle cx="28" cy="27" r="5" fill="#4154f1"/>
    <text x="50" y="26" font-family="'Nunito', sans-serif" font-size="11" font-weight="bold" fill="#012970">Automate</text>
    <text x="50" y="38" font-family="sans-serif" font-size="9" fill="#38a169">24/7 Active</text>
  </g>

  <!-- Node 4: LLM GPT Prompt -->
  <g transform="translate(320, 230)" filter="url(#shai)">
    <rect width="100" height="55" rx="14" fill="#ffffff" stroke="#e1ecff" stroke-width="1.5"/>
    <rect x="14" y="16" width="72" height="8" rx="4" fill="url(#gai1)"/>
    <rect x="14" y="28" width="55" height="6" rx="3" fill="#012970" opacity="0.6"/>
    <rect x="14" y="38" width="40" height="6" rx="3" fill="#47b2e4" opacity="0.6"/>
  </g>
</svg>