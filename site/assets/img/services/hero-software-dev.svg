<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="gsft1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4154f1"/>
      <stop offset="100%" stop-color="#47b2e4"/>
    </linearGradient>
    <filter id="shsft">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4154f1" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="250" cy="200" r="160" fill="url(#gsft1)" opacity="0.08"/>
  
  <!-- Main IDE Window -->
  <g transform="translate(60, 50)" filter="url(#shsft)">
    <rect width="380" height="270" rx="18" fill="#ffffff" stroke="#e1ecff" stroke-width="2"/>
    <!-- Window Bar -->
    <rect width="380" height="38" rx="18" fill="#012970"/>
    <circle cx="20" cy="19" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="19" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="19" r="5" fill="#27c93f"/>
    <text x="80" y="23" font-family="'Nunito', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Enterprise Architect Studio v4.2</text>
    
    <!-- Code Sidebar -->
    <rect y="38" width="110" height="232" fill="#f6f9fc"/>
    <rect x="15" y="55" width="80" height="8" rx="4" fill="#4154f1" opacity="0.8"/>
    <rect x="15" y="75" width="60" height="6" rx="3" fill="#012970" opacity="0.5"/>
    <rect x="25" y="90" width="65" height="6" rx="3" fill="#012970" opacity="0.4"/>
    <rect x="25" y="105" width="50" height="6" rx="3" fill="#012970" opacity="0.4"/>
    <rect x="15" y="130" width="75" height="8" rx="4" fill="#47b2e4" opacity="0.8"/>
    <rect x="25" y="145" width="60" height="6" rx="3" fill="#012970" opacity="0.4"/>
    <rect x="25" y="160" width="50" height="6" rx="3" fill="#012970" opacity="0.4"/>

    <!-- Code Editor Body -->
    <rect x="125" y="55" width="100" height="8" rx="4" fill="#4154f1"/>
    <rect x="125" y="72" width="180" height="6" rx="3" fill="#012970" opacity="0.7"/>
    <rect x="145" y="86" width="140" height="6" rx="3" fill="#47b2e4"/>
    <rect x="145" y="100" width="120" height="6" rx="3" fill="#012970" opacity="0.6"/>
    <rect x="165" y="114" width="100" height="6" rx="3" fill="#27c93f"/>
    <rect x="125" y="130" width="160" height="6" rx="3" fill="#012970" opacity="0.7"/>
    <rect x="125" y="146" width="80" height="6" rx="3" fill="#4154f1"/>

    <!-- Architecture Preview Box -->
    <rect x="125" y="170" width="235" height="85" rx="10" fill="#f6f9fc" stroke="#e1ecff"/>
    <rect x="140" y="185" width="60" height="30" rx="6" fill="#e1ecff"/>
    <text x="170" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#4154f1">Core Engine</text>
    <path d="M200 200 L230 200" stroke="#4154f1" stroke-width="2"/>
    <rect x="230" y="185" width="60" height="30" rx="6" fill="url(#gsft1)"/>
    <text x="260" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">API Gateway</text>
    <path d="M290 200 L315 200" stroke="#4154f1" stroke-width="2"/>
    <circle cx="330" cy="200" r="14" fill="#012970"/>
    <text x="330" y="204" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">DB</text>
  </g>
</svg>