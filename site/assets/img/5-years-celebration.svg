<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">5 Years Celebration</title>
  <desc id="desc">5 years celebration artwork based on the original black and gold stage design.</desc>
  <defs>
    <radialGradient id="coverGlow" cx="50%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#4e2b00" stop-opacity="0.96"/>
      <stop offset="58%" stop-color="#1e1000" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7cc"/>
      <stop offset="20%" stop-color="#f5d979"/>
      <stop offset="46%" stop-color="#c98b12"/>
      <stop offset="72%" stop-color="#ffdf84"/>
      <stop offset="100%" stop-color="#8f5600"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b5"/>
      <stop offset="100%" stop-color="#9a5b00"/>
    </linearGradient>
    <filter id="goldShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#d48b17" flood-opacity="0.5"/>
    </filter>
    <filter id="textShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3f2200" flood-opacity="0.7"/>
    </filter>
  </defs>
  <image href="9%20years%203.png" width="800" height="800" preserveAspectRatio="xMidYMid slice"/>
  <ellipse cx="400" cy="250" rx="190" ry="170" fill="url(#coverGlow)"/>
  <ellipse cx="400" cy="498" rx="200" ry="86" fill="#070707" opacity="0.88"/>
  <rect x="230" y="470" width="340" height="170" rx="26" fill="#040404" opacity="0.78"/>

  <g transform="translate(0 18)" filter="url(#goldShadow)">
    <text x="400" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="330" font-weight="900" fill="url(#goldMain)" stroke="url(#goldEdge)" stroke-width="10">5</text>
  </g>

  <g transform="translate(0 6)" filter="url(#textShadow)">
    <text x="400" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="url(#goldMain)" stroke="#efcc7b" stroke-width="2">5 YEARS</text>
    <text x="400" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="41" font-weight="700" letter-spacing="3.5" fill="#ffdd81">CELEBRATION</text>
    <text x="400" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#fff0ca">GLOBALMARCO</text>
  </g>
</svg>
