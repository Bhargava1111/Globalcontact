<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5969f3"/>
      <stop offset="100%" stop-color="#47b2e4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="160" rx="20" fill="url(#bg2)" opacity="0.1"/>
  <!-- Frontend layer -->
  <rect x="20" y="20" width="160" height="36" rx="8" fill="#4154f1" opacity="0.85"/>
  <text x="100" y="43" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">Frontend</text>
  <!-- Middle/API layer -->
  <rect x="30" y="66" width="140" height="30" rx="8" fill="#47b2e4" opacity="0.85"/>
  <text x="100" y="86" text-anchor="middle" font-family="monospace" font-size="12" fill="white" font-weight="bold">API / Backend</text>
  <!-- Database layer -->
  <rect x="45" y="106" width="110" height="30" rx="8" fill="#012970" opacity="0.75"/>
  <text x="100" y="126" text-anchor="middle" font-family="monospace" font-size="12" fill="white" font-weight="bold">Database</text>
  <!-- Arrows between layers -->
  <line x1="100" y1="56" x2="100" y2="66" stroke="#4154f1" stroke-width="2" stroke-dasharray="3"/>
  <polygon points="96,64 100,70 104,64" fill="#4154f1"/>
  <line x1="100" y1="96" x2="100" y2="106" stroke="#47b2e4" stroke-width="2" stroke-dasharray="3"/>
  <polygon points="96,104 100,110 104,104" fill="#47b2e4"/>
</svg>
