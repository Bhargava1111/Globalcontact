<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="gm1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4154f1"/>
      <stop offset="100%" stop-color="#47b2e4"/>
    </linearGradient>
    <filter id="sm1">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4154f1" flood-opacity="0.22"/>
    </filter>
    <filter id="sm2">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#4154f1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left phone (angled) -->
  <g transform="translate(60,80) rotate(-12)" filter="url(#sm2)">
    <rect width="88" height="168" rx="14" fill="#fff" stroke="#e0e8ff" stroke-width="2"/>
    <rect x="6" y="8" width="76" height="130" rx="8" fill="#f0f4ff"/>
    <!-- Status bar -->
    <rect x="6" y="8" width="76" height="12" rx="4" fill="url(#gm1)" opacity="0.8"/>
    <!-- App UI -->
    <rect x="12" y="26" width="64" height="20" rx="4" fill="url(#gm1)" opacity="0.15"/>
    <rect x="16" y="30" width="30" height="8" rx="4" fill="url(#gm1)" opacity="0.5"/>
    <rect x="12" y="52" width="30" height="30" rx="6" fill="url(#gm1)" opacity="0.2"/>
    <rect x="46" y="52" width="30" height="30" rx="6" fill="#47b2e4" opacity="0.2"/>
    <rect x="12" y="88" width="64" height="8" rx="4" fill="#4154f1" opacity="0.15"/>
    <rect x="12" y="102" width="44" height="6" rx="3" fill="#47b2e4" opacity="0.2"/>
    <rect x="12" y="114" width="64" height="6" rx="3" fill="#4154f1" opacity="0.1"/>
    <rect x="12" y="124" width="50" height="6" rx="3" fill="#47b2e4" opacity="0.15"/>
    <!-- Bottom nav -->
    <rect x="6" y="142" width="76" height="20" rx="4" fill="url(#gm1)" opacity="0.1"/>
    <circle cx="26" cy="152" r="5" fill="url(#gm1)" opacity="0.4"/>
    <circle cx="44" cy="152" r="5" fill="#47b2e4" opacity="0.3"/>
    <circle cx="62" cy="152" r="5" fill="url(#gm1)" opacity="0.4"/>
    <!-- Home indicator -->
    <rect x="30" y="162" width="28" height="4" rx="2" fill="#4154f1" opacity="0.3"/>
  </g>

  <!-- Center phone (upright, prominent) -->
  <g transform="translate(185,40)" filter="url(#sm1)">
    <rect width="110" height="210" rx="20" fill="url(#gm1)"/>
    <rect x="6" y="8" width="98" height="186" rx="14" fill="#fff"/>
    <!-- Status bar -->
    <rect x="6" y="8" width="98" height="16" rx="8" fill="url(#gm1)" opacity="0.9"/>
    <rect x="38" y="4" width="34" height="6" rx="3" fill="#fff" opacity="0.3"/>
    <!-- App header -->
    <rect x="12" y="30" width="86" height="28" rx="6" fill="url(#gm1)" opacity="0.12"/>
    <circle cx="26" cy="44" r="8" fill="url(#gm1)" opacity="0.5"/>
    <rect x="40" y="39" width="40" height="6" rx="3" fill="#4154f1" opacity="0.5"/>
    <rect x="40" y="48" width="28" height="4" rx="2" fill="#47b2e4" opacity="0.4"/>
    <!-- Cards -->
    <rect x="12" y="64" width="86" height="50" rx="8" fill="url(#gm1)" opacity="0.08" stroke="#4154f1" stroke-width="0.5" stroke-opacity="0.3"/>
    <rect x="18" y="70" width="34" height="34" rx="6" fill="url(#gm1)" opacity="0.25"/>
    <rect x="58" y="73" width="34" height="6" rx="3" fill="#4154f1" opacity="0.5"/>
    <rect x="58" y="84" width="22" height="5" rx="2.5" fill="#47b2e4" opacity="0.4"/>
    <rect x="58" y="93" width="30" height="5" rx="2.5" fill="#4154f1" opacity="0.3"/>
    <rect x="12" y="120" width="86" height="50" rx="8" fill="#47b2e4" opacity="0.07" stroke="#47b2e4" stroke-width="0.5" stroke-opacity="0.3"/>
    <rect x="18" y="126" width="34" height="34" rx="6" fill="#47b2e4" opacity="0.2"/>
    <rect x="58" y="129" width="34" height="6" rx="3" fill="#47b2e4" opacity="0.5"/>
    <rect x="58" y="140" width="22" height="5" rx="2.5" fill="#4154f1" opacity="0.4"/>
    <rect x="58" y="149" width="30" height="5" rx="2.5" fill="#47b2e4" opacity="0.3"/>
    <!-- Chart area -->
    <rect x="12" y="176" width="86" height="38" rx="6" fill="url(#gm1)" opacity="0.07"/>
    <polyline points="18,206 32,196 46,201 60,188 74,194 88,182 92,185" stroke="url(#gm1)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom nav -->
    <rect x="6" y="186" width="98" height="22" rx="8" fill="url(#gm1)" opacity="0.1"/>
    <circle cx="27" cy="197" r="6" fill="url(#gm1)" opacity="0.5"/>
    <circle cx="55" cy="197" r="6" fill="#47b2e4" opacity="0.4"/>
    <circle cx="83" cy="197" r="6" fill="url(#gm1)" opacity="0.5"/>
    <!-- Home bar -->
    <rect x="38" y="210" width="34" height="4" rx="2" fill="#4154f1" opacity="0.4"/>
  </g>

  <!-- Right phone (angled) -->
  <g transform="translate(345,90) rotate(10)" filter="url(#sm2)">
    <rect width="88" height="168" rx="14" fill="#fff" stroke="#e0e8ff" stroke-width="2"/>
    <rect x="6" y="8" width="76" height="130" rx="8" fill="#f0f4ff"/>
    <rect x="6" y="8" width="76" height="12" rx="4" fill="url(#gm1)" opacity="0.8"/>
    <!-- Dashboard UI -->
    <rect x="12" y="26" width="64" height="8" rx="4" fill="#4154f1" opacity="0.2"/>
    <!-- Mini chart -->
    <rect x="12" y="40" width="64" height="40" rx="6" fill="url(#gm1)" opacity="0.07"/>
    <polyline points="16,74 26,62 36,68 46,55 56,60 66,50 72,53" stroke="url(#gm1)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stats grid -->
    <rect x="12" y="86" width="30" height="22" rx="4" fill="#4154f1" opacity="0.15"/>
    <rect x="46" y="86" width="30" height="22" rx="4" fill="#47b2e4" opacity="0.15"/>
    <rect x="12" y="112" width="30" height="22" rx="4" fill="#47b2e4" opacity="0.12"/>
    <rect x="46" y="112" width="30" height="22" rx="4" fill="#4154f1" opacity="0.12"/>
    <!-- Values -->
    <rect x="16" y="91" width="20" height="6" rx="3" fill="#4154f1" opacity="0.5"/>
    <rect x="50" y="91" width="18" height="6" rx="3" fill="#47b2e4" opacity="0.5"/>
    <rect x="16" y="118" width="18" height="6" rx="3" fill="#47b2e4" opacity="0.4"/>
    <rect x="50" y="118" width="20" height="6" rx="3" fill="#4154f1" opacity="0.4"/>
    <!-- Bottom nav -->
    <rect x="6" y="142" width="76" height="20" rx="4" fill="url(#gm1)" opacity="0.1"/>
    <circle cx="26" cy="152" r="5" fill="url(#gm1)" opacity="0.4"/>
    <circle cx="44" cy="152" r="5" fill="#47b2e4" opacity="0.3"/>
    <circle cx="62" cy="152" r="5" fill="url(#gm1)" opacity="0.4"/>
    <rect x="30" y="162" width="28" height="4" rx="2" fill="#4154f1" opacity="0.3"/>
  </g>

  <!-- Floating elements -->
  <!-- Play store badge -->
  <g transform="translate(20,290)" filter="url(#sm2)">
    <rect width="90" height="36" rx="10" fill="url(#gm1)"/>
    <text x="12" y="15" font-size="8" fill="white" font-family="sans-serif" opacity="0.8">GET IT ON</text>
    <text x="12" y="27" font-size="11" fill="white" font-family="sans-serif" font-weight="bold">Google Play</text>
  </g>

  <!-- App Store badge -->
  <g transform="translate(390,290)" filter="url(#sm2)">
    <rect width="90" height="36" rx="10" fill="url(#gm1)"/>
    <text x="12" y="15" font-size="8" fill="white" font-family="sans-serif" opacity="0.8">Download on</text>
    <text x="12" y="27" font-size="11" fill="white" font-family="sans-serif" font-weight="bold">App Store</text>
  </g>

  <!-- Floating notification -->
  <g transform="translate(145,340)" filter="url(#sm2)">
    <rect width="200" height="40" rx="10" fill="white" opacity="0.95" stroke="#e0e8ff" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="10" fill="url(#gm1)" opacity="0.7"/>
    <rect x="38" y="12" width="80" height="6" rx="3" fill="#4154f1" opacity="0.4"/>
    <rect x="38" y="23" width="120" height="5" rx="2.5" fill="#47b2e4" opacity="0.3"/>
    <circle cx="183" cy="12" r="6" fill="#e55353"/>
    <text x="180" y="16" font-size="8" fill="white" font-family="sans-serif" text-anchor="middle">3</text>
  </g>

  <!-- Sparkles -->
  <circle cx="160" cy="45" r="4" fill="#4154f1" opacity="0.4"/>
  <circle cx="350" cy="40" r="3" fill="#47b2e4" opacity="0.5"/>
  <circle cx="470" cy="200" r="3" fill="#4154f1" opacity="0.4"/>
  <circle cx="30" cy="380" r="3" fill="#47b2e4" opacity="0.4"/>
  <circle cx="470" cy="380" r="4" fill="#4154f1" opacity="0.3"/>
</svg>
