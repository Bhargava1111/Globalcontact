<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4154f1"/>
      <stop offset="100%" stop-color="#47b2e4"/>
    </linearGradient>
    <linearGradient id="screen1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1ecff"/>
      <stop offset="100%" stop-color="#f6f9fc"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="200" height="160" rx="20" fill="url(#bg1)" opacity="0.12"/>
  <!-- Monitor -->
  <rect x="30" y="28" width="140" height="90" rx="8" fill="url(#bg1)" opacity="0.9"/>
  <rect x="38" y="36" width="124" height="74" rx="4" fill="url(#screen1)"/>
  <!-- Monitor stand -->
  <rect x="88" y="118" width="24" height="12" rx="3" fill="#4154f1" opacity="0.5"/>
  <rect x="75" y="128" width="50" height="6" rx="3" fill="#4154f1" opacity="0.4"/>
  <!-- Code lines on screen -->
  <rect x="46" y="46" width="40" height="5" rx="2.5" fill="#4154f1" opacity="0.5"/>
  <rect x="46" y="56" width="60" height="5" rx="2.5" fill="#47b2e4" opacity="0.6"/>
  <rect x="52" y="66" width="50" height="5" rx="2.5" fill="#4154f1" opacity="0.4"/>
  <rect x="52" y="76" width="35" height="5" rx="2.5" fill="#47b2e4" opacity="0.5"/>
  <rect x="46" y="86" width="55" height="5" rx="2.5" fill="#4154f1" opacity="0.4"/>
  <!-- Gear icon on right side -->
  <circle cx="135" cy="65" r="18" fill="#4154f1" opacity="0.15"/>
  <circle cx="135" cy="65" r="10" fill="none" stroke="#4154f1" stroke-width="3"/>
  <circle cx="135" cy="65" r="4" fill="#4154f1" opacity="0.7"/>
  <rect x="133" y="50" width="4" height="7" rx="2" fill="#4154f1" opacity="0.7"/>
  <rect x="133" y="73" width="4" height="7" rx="2" fill="#4154f1" opacity="0.7"/>
  <rect x="120" y="63" width="7" height="4" rx="2" fill="#4154f1" opacity="0.7"/>
  <rect x="143" y="63" width="7" height="4" rx="2" fill="#4154f1" opacity="0.7"/>
</svg>
