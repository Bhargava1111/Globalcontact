<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="gb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4154f1"/>
      <stop offset="100%" stop-color="#47b2e4"/>
    </linearGradient>
    <linearGradient id="gb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4154f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#47b2e4" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4154f1" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4154f1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Monitor base -->
  <rect x="80" y="60" width="300" height="200" rx="12" ry="12" fill="url(#gb2)" stroke="url(#gb1)" stroke-width="2.5" filter="url(#shadow1)"/>
  <rect x="90" y="70" width="280" height="175" rx="8" ry="8" fill="#0d1b4b"/>
  <!-- Screen glow -->
  <rect x="90" y="70" width="280" height="175" rx="8" ry="8" fill="url(#gb2)" opacity="0.5"/>

  <!-- Code lines on screen -->
  <rect x="105" y="88" width="60" height="6" rx="3" fill="#47b2e4" opacity="0.9"/>
  <rect x="105" y="102" width="120" height="5" rx="2.5" fill="#4154f1" opacity="0.7"/>
  <rect x="105" y="115" width="90" height="5" rx="2.5" fill="#47b2e4" opacity="0.5"/>
  <rect x="105" y="128" width="140" height="5" rx="2.5" fill="#4154f1" opacity="0.6"/>
  <rect x="105" y="141" width="75" height="5" rx="2.5" fill="#47b2e4" opacity="0.8"/>
  <rect x="105" y="154" width="110" height="5" rx="2.5" fill="#4154f1" opacity="0.5"/>
  <rect x="105" y="167" width="95" height="5" rx="2.5" fill="#47b2e4" opacity="0.7"/>
  <rect x="105" y="180" width="130" height="5" rx="2.5" fill="#4154f1" opacity="0.6"/>
  <rect x="105" y="193" width="80" height="5" rx="2.5" fill="#47b2e4" opacity="0.5"/>
  <rect x="105" y="206" width="100" height="5" rx="2.5" fill="#4154f1" opacity="0.4"/>
  <rect x="105" y="219" width="60" height="5" rx="2.5" fill="#47b2e4" opacity="0.6"/>

  <!-- Mini browser panel on right of screen -->
  <rect x="230" y="85" width="125" height="150" rx="6" fill="#fff" opacity="0.08"/>
  <rect x="234" y="89" width="117" height="14" rx="3" fill="#47b2e4" opacity="0.3"/>
  <circle cx="241" cy="96" r="3" fill="#4154f1" opacity="0.5"/>
  <circle cx="251" cy="96" r="3" fill="#47b2e4" opacity="0.5"/>
  <circle cx="261" cy="96" r="3" fill="#fff" opacity="0.3"/>
  <rect x="234" y="108" width="117" height="40" rx="3" fill="#fff" opacity="0.05"/>
  <rect x="239" y="114" width="60" height="6" rx="3" fill="#fff" opacity="0.3"/>
  <rect x="239" y="124" width="80" height="4" rx="2" fill="#47b2e4" opacity="0.3"/>
  <rect x="234" y="153" width="55" height="30" rx="3" fill="#4154f1" opacity="0.2"/>
  <rect x="295" y="153" width="56" height="30" rx="3" fill="#47b2e4" opacity="0.2"/>
  <rect x="234" y="188" width="117" height="40" rx="3" fill="#fff" opacity="0.04"/>
  <rect x="239" y="195" width="90" height="4" rx="2" fill="#fff" opacity="0.2"/>
  <rect x="239" y="204" width="70" height="4" rx="2" fill="#47b2e4" opacity="0.2"/>
  <rect x="239" y="213" width="80" height="4" rx="2" fill="#fff" opacity="0.15"/>

  <!-- Monitor stand -->
  <rect x="215" y="260" width="30" height="30" rx="4" fill="url(#gb1)" opacity="0.6"/>
  <rect x="195" y="288" width="70" height="10" rx="5" fill="url(#gb1)" opacity="0.5"/>

  <!-- Floating gear top-right -->
  <g transform="translate(410,55) rotate(15)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#gb1)" stroke-width="4"/>
    <circle cx="0" cy="0" r="10" fill="url(#gb1)" opacity="0.7"/>
    <rect x="-4" y="-28" width="8" height="12" rx="4" fill="url(#gb1)" opacity="0.9"/>
    <rect x="-4" y="16" width="8" height="12" rx="4" fill="url(#gb1)" opacity="0.9"/>
    <rect x="-28" y="-4" width="12" height="8" rx="4" fill="url(#gb1)" opacity="0.9"/>
    <rect x="16" y="-4" width="12" height="8" rx="4" fill="url(#gb1)" opacity="0.9"/>
    <rect x="-22" y="-22" width="8" height="8" rx="2" fill="url(#gb1)" opacity="0.7" transform="rotate(45)"/>
    <rect x="14" y="-22" width="8" height="8" rx="2" fill="url(#gb1)" opacity="0.7" transform="rotate(45)"/>
  </g>

  <!-- Floating code tag top-left -->
  <g filter="url(#shadow2)" transform="translate(15,80)">
    <rect width="68" height="36" rx="10" fill="white" opacity="0.9"/>
    <text x="10" y="15" font-size="11" fill="#4154f1" font-family="monospace" font-weight="bold">&lt;/&gt;</text>
    <rect x="8" y="20" width="40" height="4" rx="2" fill="#4154f1" opacity="0.3"/>
    <rect x="8" y="27" width="28" height="4" rx="2" fill="#47b2e4" opacity="0.3"/>
  </g>

  <!-- Floating HTML badge bottom-left -->
  <g filter="url(#shadow2)" transform="translate(10,200)">
    <rect width="70" height="52" rx="12" fill="url(#gb1)"/>
    <text x="12" y="22" font-size="10" fill="white" font-family="monospace" font-weight="bold">HTML5</text>
    <text x="12" y="38" font-size="8" fill="white" opacity="0.7" font-family="monospace">CSS3</text>
    <text x="12" y="49" font-size="7" fill="white" opacity="0.5" font-family="monospace">JS ES6+</text>
  </g>

  <!-- Floating browser badge right -->
  <g filter="url(#shadow2)" transform="translate(400,170)">
    <rect width="78" height="50" rx="12" fill="white" opacity="0.95"/>
    <rect x="6" y="6" width="66" height="12" rx="4" fill="#f0f4ff"/>
    <circle cx="13" cy="12" r="3" fill="#e55353"/>
    <circle cx="22" cy="12" r="3" fill="#f7c05a"/>
    <circle cx="31" cy="12" r="3" fill="#22c55e"/>
    <rect x="6" y="22" width="30" height="8" rx="3" fill="#4154f1" opacity="0.2"/>
    <rect x="40" y="22" width="30" height="8" rx="3" fill="#47b2e4" opacity="0.2"/>
    <rect x="6" y="34" width="66" height="4" rx="2" fill="#4154f1" opacity="0.15"/>
    <rect x="6" y="41" width="45" height="4" rx="2" fill="#47b2e4" opacity="0.15"/>
  </g>

  <!-- Floating DB badge bottom-right -->
  <g filter="url(#shadow2)" transform="translate(405,280)">
    <rect width="68" height="58" rx="12" fill="white" opacity="0.95"/>
    <ellipse cx="34" cy="16" rx="22" ry="8" fill="#4154f1" opacity="0.3" stroke="#4154f1" stroke-width="1.5"/>
    <rect x="12" y="16" width="44" height="16" fill="#4154f1" opacity="0.15"/>
    <ellipse cx="34" cy="32" rx="22" ry="8" fill="#47b2e4" opacity="0.3" stroke="#47b2e4" stroke-width="1.5"/>
    <rect x="12" y="32" width="44" height="12" fill="#47b2e4" opacity="0.1"/>
    <ellipse cx="34" cy="44" rx="22" ry="8" fill="#4154f1" opacity="0.2" stroke="#4154f1" stroke-width="1.5"/>
  </g>

  <!-- Floating gear bottom-left small -->
  <g transform="translate(45,310) rotate(-20)" opacity="0.6">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#47b2e4" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#47b2e4" opacity="0.5"/>
    <rect x="-2.5" y="-18" width="5" height="8" rx="2.5" fill="#47b2e4"/>
    <rect x="-2.5" y="10" width="5" height="8" rx="2.5" fill="#47b2e4"/>
    <rect x="-18" y="-2.5" width="8" height="5" rx="2.5" fill="#47b2e4"/>
    <rect x="10" y="-2.5" width="8" height="5" rx="2.5" fill="#47b2e4"/>
  </g>

  <!-- Sparkles -->
  <circle cx="170" cy="40" r="4" fill="#4154f1" opacity="0.5"/>
  <circle cx="345" cy="30" r="3" fill="#47b2e4" opacity="0.6"/>
  <circle cx="460" cy="120" r="3" fill="#4154f1" opacity="0.4"/>
  <circle cx="30" cy="150" r="3" fill="#47b2e4" opacity="0.5"/>
  <circle cx="460" cy="360" r="4" fill="#4154f1" opacity="0.4"/>
  <circle cx="80" cy="380" r="3" fill="#47b2e4" opacity="0.5"/>

  <!-- Connecting dots/lines -->
  <line x1="90" y1="310" x2="150" y2="350" stroke="#4154f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="395" y1="230" x2="415" y2="275" stroke="#47b2e4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
</svg>
