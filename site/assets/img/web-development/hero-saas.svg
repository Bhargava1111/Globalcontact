    <rect x="255" y="70" width="100" height="60" rx="10" fill="#f6f9fc" stroke="#e1ecff"/>
    <text x="265" y="92" font-family="sans-serif" font-size="10" fill="#27c93f" font-weight="bold">UPTIME SLA</text>
    <text x="265" y="115" font-family="'Nunito', sans-serif" font-size="18" font-weight="900" fill="#012970">99.99%</text>

    <!-- Main Chart area -->
    <rect x="25" y="145" width="330" height="115" rx="12" fill="#f6f9fc" stroke="#e1ecff"/>
    <!-- Line chart path -->
    <path d="M45 220 Q 95 190, 145 205 T 245 170 T 330 160" fill="none" stroke="url(#gsaas1)" stroke-width="4"/>
    <path d="M45 220 Q 95 190, 145 205 T 245 170 T 330 160 L 330 240 L 45 240 Z" fill="url(#gsaas1)" opacity="0.1"/>
    <circle cx="330" cy="160" r="5" fill="#4154f1"/>
