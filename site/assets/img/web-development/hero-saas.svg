<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="gsaas1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4154f1"/>
      <stop offset="100%" stop-color="#47b2e4"/>
    </linearGradient>
    <filter id="shsaas">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4154f1" flood-opacity="0.18"/>
    </filter>
  </defs>
  <circle cx="250" cy="200" r="160" fill="url(#gsaas1)" opacity="0.08"/>
  <g transform="translate(60, 50)" filter="url(#shsaas)">
    <rect width="380" height="280" rx="20" fill="#ffffff" stroke="#e1ecff" stroke-width="2"/>
    <!-- Header -->
    <rect width="380" height="50" rx="20" fill="#012970"/>
    <circle cx="30" cy="25" r="10" fill="url(#gsaas1)"/>
    <text x="50" y="30" font-family="'Nunito', sans-serif" font-weight="900" font-size="14" fill="#ffffff">CloudSaaS Platform</text>
    <rect x="280" y="15" width="80" height="22" rx="6" fill="#47b2e4"/>
    <text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">Enterprise Tier</text>

    <!-- Metrics row -->
    <rect x="25" y="70" width="100" height="60" rx="10" fill="#f6f9fc" stroke="#e1ecff"/>
    <text x="35" y="92" font-family="sans-serif" font-size="10" fill="#47b2e4" font-weight="bold">ACTIVE USERS</text>
    <text x="35" y="115" font-family="'Nunito', sans-serif" font-size="18" font-weight="900" fill="#012970">24,580</text>

    <rect x="140" y="70" width="100" height="60" rx="10" fill="#f6f9fc" stroke="#e1ecff"/>
    <text x="150" y="92" font-family="sans-serif" font-size="10" fill="#4154f1" font-weight="bold">MONTHLY MRR</text>
