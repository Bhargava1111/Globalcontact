<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="gpwa1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4154f1"/>
      <stop offset="100%" stop-color="#47b2e4"/>
    </linearGradient>
    <filter id="shpwa">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4154f1" flood-opacity="0.18"/>
    </filter>
  </defs>
  <circle cx="250" cy="200" r="160" fill="url(#gpwa1)" opacity="0.08"/>
  
  <!-- Desktop Screen in Back -->
  <g transform="translate(60, 60)" filter="url(#shpwa)">
    <rect width="280" height="180" rx="14" fill="#ffffff" stroke="#e1ecff" stroke-width="2"/>
    <rect width="280" height="28" rx="14" fill="#f6f9fc"/>
    <circle cx="15" cy="14" r="4" fill="#ff5f56"/>
    <circle cx="28" cy="14" r="4" fill="#ffbd2e"/>
    <circle cx="41" cy="14" r="4" fill="#27c93f"/>
    <rect x="20" y="45" width="100" height="10" rx="5" fill="#012970" opacity="0.8"/>
    <rect x="20" y="65" width="160" height="8" rx="4" fill="#47b2e4" opacity="0.5"/>
    <rect x="20" y="90" width="60" height="40" rx="6" fill="url(#gpwa1)" opacity="0.2"/>
    <rect x="90" y="90" width="60" height="40" rx="6" fill="url(#gpwa1)" opacity="0.25"/>
  </g>

  <!-- Mobile Phone in Front -->
  <g transform="translate(260, 90)" filter="url(#shpwa)">
    <rect width="160" height="260" rx="24" fill="#012970" stroke="#4154f1" stroke-width="3"/>
    <!-- Phone screen -->
    <rect x="8" y="15" width="144" height="230" rx="18" fill="#ffffff"/>
    <!-- App header -->
    <rect x="8" y="15" width="144" height="45" rx="18" fill="url(#gpwa1)"/>
    <circle cx="30" cy="38" r="10" fill="#fff" opacity="0.3"/>
    <rect x="50" y="32" width="60" height="8" rx="4" fill="#fff"/>
    <!-- App body -->
    <rect x="20" y="75" width="120" height="35" rx="8" fill="#f6f9fc" stroke="#e1ecff"/>
    <rect x="30" y="85" width="70" height="6" rx="3" fill="#012970"/>
    <rect x="30" y="96" width="50" height="5" rx="2.5" fill="#47b2e4"/>

    <rect x="20" y="120" width="120" height="35" rx="8" fill="#f6f9fc" stroke="#e1ecff"/>
    <rect x="30" y="130" width="70" height="6" rx="3" fill="#012970"/>
    <rect x="30" y="141" width="50" height="5" rx="2.5" fill="#4154f1"/>

    <!-- Install PWA notification banner -->
    <rect x="16" y="170" width="128" height="45" rx="10" fill="#f0fff4" stroke="#c6f6d5"/>
    <text x="80" y="188" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="#22543d">Add to Home Screen</text>
    <rect x="38" y="196" width="84" height="14" rx="4" fill="#38a169"/>
    <text x="80" y="206" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="8" fill="#fff">INSTALL APP</text>
  </g>
</svg>