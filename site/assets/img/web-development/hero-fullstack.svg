<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="gfs1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4154f1"/>
      <stop offset="100%" stop-color="#47b2e4"/>
    </linearGradient>
    <linearGradient id="gfs2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#012970"/>
      <stop offset="100%" stop-color="#4154f1"/>
    </linearGradient>
    <filter id="shfs">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#4154f1" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="250" cy="200" r="170" fill="url(#gfs1)" opacity="0.08"/>
  
  <!-- Layer 1: Frontend Desktop (Top) -->
  <g transform="translate(100, 40)" filter="url(#shfs)">
    <rect width="300" height="70" rx="14" fill="#ffffff" stroke="#e1ecff" stroke-width="2"/>
    <rect x="15" y="15" width="40" height="40" rx="10" fill="url(#gfs1)"/>
    <text x="35" y="41" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="900" font-size="20" fill="#fff">UI</text>
    <rect x="70" y="22" width="130" height="10" rx="5" fill="#012970" opacity="0.8"/>
    <rect x="70" y="38" width="90" height="8" rx="4" fill="#47b2e4" opacity="0.6"/>
    <rect x="220" y="20" width="65" height="30" rx="8" fill="#e1ecff"/>
    <text x="252" y="40" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4154f1">Frontend</text>
  </g>

  <!-- Connecting Pipe 1 -->
  <path d="M250 110 L250 145" stroke="url(#gfs1)" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="250" cy="128" r="5" fill="#47b2e4"/>

  <!-- Layer 2: API & Business Logic (Middle) -->
  <g transform="translate(80, 150)" filter="url(#shfs)">
    <rect width="340" height="80" rx="14" fill="#ffffff" stroke="#e1ecff" stroke-width="2"/>
    <rect x="15" y="20" width="40" height="40" rx="10" fill="url(#gfs2)"/>
    <text x="35" y="46" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="900" font-size="18" fill="#fff">&lt;/&gt;</text>
    <rect x="70" y="26" width="150" height="10" rx="5" fill="#012970" opacity="0.8"/>
    <rect x="70" y="44" width="110" height="8" rx="4" fill="#4154f1" opacity="0.6"/>
    <rect x="250" y="25" width="75" height="30" rx="8" fill="url(#gfs1)" opacity="0.15"/>
    <text x="287" y="45" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4154f1">REST / GraphQL</text>
  </g>

  <!-- Connecting Pipe 2 -->
  <path d="M250 230 L250 265" stroke="url(#gfs1)" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="250" cy="248" r="5" fill="#4154f1"/>

  <!-- Layer 3: Database & Cloud (Bottom) -->
  <g transform="translate(100, 270)" filter="url(#shfs)">
    <rect width="300" height="80" rx="14" fill="#ffffff" stroke="#e1ecff" stroke-width="2"/>
    <rect x="15" y="20" width="40" height="40" rx="10" fill="url(#gfs1)"/>
    <text x="35" y="46" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="900" font-size="18" fill="#fff">DB</text>
    <rect x="70" y="26" width="130" height="10" rx="5" fill="#012970" opacity="0.8"/>
    <rect x="70" y="44" width="90" height="8" rx="4" fill="#47b2e4" opacity="0.6"/>
    <rect x="220" y="25" width="65" height="30" rx="8" fill="#e1ecff"/>
    <text x="252" y="45" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#012970">Postgres / SQL</text>
  </g>
</svg>